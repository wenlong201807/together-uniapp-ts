version: '3.8'

services:
  # Nginx 反向代理（始终运行）
  nginx-proxy:
    image: nginx:alpine
    container_name: together-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - frontend-network
    depends_on:
      - frontend-blue

  # 蓝色环境
  frontend-blue:
    build:
      context: ..
      dockerfile: linux-190-deploy/Dockerfile
    container_name: together-frontend-blue
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 绿色环境
  frontend-green:
    build:
      context: ..
      dockerfile: linux-190-deploy/Dockerfile
    container_name: together-frontend-green
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", --spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - green

  certbot:
    image: certbot/certbot
    container_name: together-certbot-staging
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge

volumes:
  certbot-conf:
  certbot-www:
