services:
  # Nginx 反向代理（始终运行，蓝绿切换入口）
  nginx-proxy:
    image: nginx:alpine
    container_name: together-nginx-proxy
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./config/nginx/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 蓝色环境
  frontend-blue:
    build:
      context: ..
      dockerfile: linux-190-deploy/Dockerfile.blue-green
    container_name: together-frontend-blue
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 绿色环境
  frontend-green:
    build:
      context: ..
      dockerfile: linux-190-deploy/Dockerfile.blue-green
    container_name: together-frontend-green
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - green

  certbot:
    image: certbot/certbot
    container_name: together-certbot-staging
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge

volumes:
  certbot-conf:
    external: true
  certbot-www:
    external: true
