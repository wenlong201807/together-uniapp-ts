# 上游服务器配置 - 蓝绿部署
# 活跃环境：green（默认）
upstream frontend_backend {
    # server together-frontend-blue:8080 max_fails=3 fail_timeout=30s;
    server together-frontend-green:8080 max_fails=3 fail_timeout=30s;
}

# HTTP 服务器 - 内部端口 8088
server {
    listen 8088;
    server_name localhost;

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 前端应用代理到上游服务器（蓝绿切换）
    location / {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 错误页面处理
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    location = /50x.html {
        internal;
        default_type text/html;
        return 503 '<html><body><h1>Service Temporarily Unavailable</h1><p>The server is temporarily unable to handle your request. Please try again later.</p></body></html>';
    }
}
