user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 上游服务器配置 - 蓝绿部署
    upstream frontend_backend {
        server together-frontend-blue:8080 max_fails=3 fail_timeout=30s;
    }

    # HTTP 服务器 - 内部端口 8088
    server {
        listen 8088;
        server_name localhost;

        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 前端应用代理到上游服务器（蓝绿切换）
        location / {
            proxy_pass http://frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时设置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 错误页面处理
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }

        location = /50x.html {
            internal;
            default_type text/html;
            return 503 '<html><body><h1>Service Temporarily Unavailable</h1><p>The server is temporarily unable to handle your re. Please try again later.</p></body></html>';
        }
    }
}
