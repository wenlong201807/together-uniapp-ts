        fill="white" text-anchor="middle" letter-spacing="4">
    ENFP
  </text>

  <!-- 类型名称 -->
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="16"
        fill="rgba(255,255,255,0.9)" text-anchor="middle">
