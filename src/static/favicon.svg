<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8e53;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 心形背景 -->
  <circle cx="50" cy="50" r="48" fill="url(#heartGradient)"/>
  <!-- 双心形图案 -->
  <g transform="translate(50, 50)">
    <!-- 左边的心 -->
    <path d="M-12,-8 C-12,-12 -16,-16 -20,-16 C-24,-16 -28,-12 -28,-8 C-28,-4 -24,0 -12,12 C0,0 4,-4 4,-8 C4,-12 0,-16 -4,-16 C-8,-16 -12,-12 -12,-8 Z" fill="white" opacity="0.9"/>
    <!-- 右边的心 -->
    <path d="M12,-8 C12,-12 8,-16 4,-16 C0,-16 -4,-12 -4,-8 C-4,-4 0,0 12,12 C24,0 28,-4 28,-8 C28,-12 24,-16 20,-16 C16,-16 12,-12 12,-8 Z" fill="white" opacity="0.9"/>
  </g>
</svg>
